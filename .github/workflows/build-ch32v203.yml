name: build-ch32v203
on:
  push:
    branches: [onboarddap]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proto: [v2, v1]
    steps:
      - uses: actions/checkout@v4
      - name: Install xPack riscv-none-elf-gcc (SHA-256 checked) and ninja
        run: |
          set -e
          V=15.2.0-1
          F=xpack-riscv-none-elf-gcc-$V-linux-x64.tar.gz
          curl -fsSL -O https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v$V/$F
          curl -fsSL -O https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v$V/$F.sha
          sha256sum -c $F.sha
          tar xf $F -C "$HOME"
          echo "$HOME/xpack-riscv-none-elf-gcc-$V/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Configure and build
        working-directory: CH32V203
        run: |
          FLAG=OFF; [ "${{ matrix.proto }}" = v1 ] && FLAG=ON
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/riscv-none-elf.cmake -DDAP_FW_V1=$FLAG
          cmake --build build
      - name: Guard - SWD clock throttle loop must survive optimization
        working-directory: CH32V203
        run: |
          riscv-none-elf-objdump -d --no-show-raw-insn build/DAPLink.elf | awk '/<SWD_Transfer>:/,/^$/' > swdt.txt
          python3 - <<'PY'
          import re,sys
          rows=[]
          for l in open("swdt.txt"):
              m=re.match(r"\s*([0-9a-f]+):\s+(.*)",l)
              if m: rows.append((m.group(1),m.group(2).strip()))
          n=sum(1 for i in range(1,len(rows))
                if re.match(r"bnez\s+\w+,([0-9a-f]+)",rows[i][1]) and re.match(r"bnez\s+\w+,([0-9a-f]+)",rows[i][1]).group(1)==rows[i-1][0]
                and rows[i-1][1].startswith("addi") and "-1" in rows[i-1][1])
          print("tight delay loops in SWD_Transfer:",n)
          sys.exit(0 if n>0 else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DAPLink-${{ matrix.proto }}
          path: |
            CH32V203/build/DAPLink.elf
            CH32V203/build/DAPLink.bin
            CH32V203/build/DAPLink.hex
            CH32V203/build/DAPLink.map
